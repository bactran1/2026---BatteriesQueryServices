[server]
host = "0.0.0.0"
port = 8000

[serial]
port = "/dev/ttyUSB0"
baudrate = 9600
timeout_seconds = 2.0

[polling]
interval_seconds = 10

[buffer]
enabled = true
path = "/data/collector-buffer.sqlite3"
retention_hours = 24
sample_interval_seconds = 60

[inverter]
enabled = true
id = "renogy-x-8k"
model = "Renogy X 8K (Megarevo R8KLNA-compatible)"
transport = "serial"
serial_port = "/dev/ttyUSB1"
# To use the installed LSW-5 instead of a second USB adapter, change transport
# to "solarman_v5" and set the logger's LAN address and printed serial number:
# host = "192.168.20.138"
# tcp_port = 8899
# logger_serial = 3503566593
address = 1
baudrate = 9600
timeout_seconds = 2.0
parity = "N"
retries = 2

[[batteries]]
id = "rack-1"
address = 1

[[batteries]]
id = "rack-2"
address = 2

[[batteries]]
id = "rack-3"
address = 3

# The fourth pack, a first-generation Eco-worthy 51.2 V 314 Ah floor-standing
# unit on casters, on DIP address 4. Its PACE BMS has its own USB RS485 adapter,
# mapped to /dev/ttyUSB2 by deploy-collector.sh (--floor-serial-device).
[[batteries]]
id = "rack-4"
address = 4
serial_port = "/dev/ttyUSB2"
