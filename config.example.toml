[server]
host = "0.0.0.0"
port = 8000

[serial]
port = "/dev/ttyUSB0"
baudrate = 9600
timeout_seconds = 2.0

[polling]
interval_seconds = 10

[buffer]
enabled = true
path = "/data/collector-buffer.sqlite3"
retention_hours = 24
sample_interval_seconds = 60

[inverter]
enabled = true
id = "renogy-x-8k"
model = "Renogy X 8K (Megarevo R8KLNA-compatible)"
serial_port = "/dev/ttyUSB1"
address = 1
baudrate = 9600
timeout_seconds = 2.0
parity = "N"
retries = 2

[[batteries]]
id = "rack-1"
address = 1

[[batteries]]
id = "rack-2"
address = 2

[[batteries]]
id = "rack-3"
address = 3
