name: iOS build

# Automatically builds the iOS wrapper on macOS whenever the app changes, so a
# broken project or Swift error is caught without anyone opening Xcode. The build
# is unsigned for the Simulator, so it needs no Apple account or secrets.
on:
  push:
    branches: [ios-app]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      # The app icon is committed (icon-1024.png); scripts/make-appicon.py only
      # needs to run locally when the source icon changes, so CI doesn't
      # regenerate it (and doesn't need Pillow installed).

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List schemes (diagnostic)
        run: xcodebuild -project BatteryMonitor.xcodeproj -list

      - name: Build (unsigned, Simulator SDK)
        run: |
          set -o pipefail
          if ! xcodebuild \
            -project BatteryMonitor.xcodeproj \
            -scheme BatteryMonitor \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log; then
            echo "Build failed — surfacing errors as annotations:"
            grep -aE "error:|The following build commands failed|not found|Unable to find" build.log \
              | sort -u | tail -40 \
              | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi

      - name: Package .app
        run: |
          APP_PATH="$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" BatteryMonitor-simulator.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BatteryMonitor-simulator-app
          path: ios/BatteryMonitor-simulator.app.zip
          if-no-files-found: error
