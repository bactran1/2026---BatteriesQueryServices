services:
  battery-monitor:
    image: ${MONITOR_IMAGE_NAME:-battery-monitor}:${MONITOR_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: monitor/Dockerfile
      args:
        MONITOR_COMMIT: ${MONITOR_COMMIT:-unknown}
    container_name: battery-monitor
    restart: unless-stopped
    environment:
      BQM_COLLECTOR_URL: ${BQM_COLLECTOR_URL:-http://raspberrypi.local:8000}
      BQM_COLLECTOR_TIMEOUT_SECONDS: ${BQM_COLLECTOR_TIMEOUT_SECONDS:-5}
      BQM_LIVE_POLL_INTERVAL_SECONDS: ${BQM_LIVE_POLL_INTERVAL_SECONDS:-5}
      BQM_STALE_AFTER_SECONDS: ${BQM_STALE_AFTER_SECONDS:-30}
      BQM_OFFLINE_AFTER_SECONDS: ${BQM_OFFLINE_AFTER_SECONDS:-120}
      BQM_BACKFILL_PAGE_SIZE: ${BQM_BACKFILL_PAGE_SIZE:-500}
      BQM_DATA_DIR: /data
      BQM_LOG_INTERVAL_SECONDS: ${BQM_LOG_INTERVAL_SECONDS:-60}
      BQM_RETENTION_DAYS: ${BQM_RETENTION_DAYS:-1095}
      BQM_RACK_NAME: ${BQM_RACK_NAME:-Eco-worthy Rack}
      BQM_RACK_BUILDER: ${BQM_RACK_BUILDER:-Tran Thanh Tuan}
      BQM_RACK_LOCATION: ${BQM_RACK_LOCATION:-Battery room}
      BQM_COLLECTOR_NAME: ${BQM_COLLECTOR_NAME:-Raspberry Pi collector}
      BQM_BATTERY_IDS: ${BQM_BATTERY_IDS:-rack-1,rack-2,rack-3}
      BQM_BATTERY_ADDRESSES: ${BQM_BATTERY_ADDRESSES:-1,2,3}
      BQM_BATTERY_NAMES: ${BQM_BATTERY_NAMES:-Rack Battery 1,Rack Battery 2,Rack Battery 3}
      BQM_BATTERY_IPS: ${BQM_BATTERY_IPS:-,,}
      BQM_BATTERY_MODELS: ${BQM_BATTERY_MODELS:-Eco-worthy server rack battery,Eco-worthy server rack battery,Eco-worthy server rack battery}
    volumes:
      - ./data/monitor:/data
    ports:
      - "8080:8080"
