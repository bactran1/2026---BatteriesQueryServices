services:
  battery-monitor:
    image: ${MONITOR_IMAGE_NAME:-battery-monitor}:${MONITOR_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: monitor/Dockerfile
      args:
        MONITOR_COMMIT: ${MONITOR_COMMIT:-unknown}
        MONITOR_COMMIT_DATE: ${MONITOR_COMMIT_DATE:-}
    container_name: battery-monitor
    restart: unless-stopped
    environment:
      BQM_COLLECTOR_URL: ${BQM_COLLECTOR_URL:-http://192.168.10.194:8000}
      BQM_COLLECTOR_TIMEOUT_SECONDS: ${BQM_COLLECTOR_TIMEOUT_SECONDS:-5}
      BQM_LIVE_POLL_INTERVAL_SECONDS: ${BQM_LIVE_POLL_INTERVAL_SECONDS:-5}
      BQM_STALE_AFTER_SECONDS: ${BQM_STALE_AFTER_SECONDS:-30}
      BQM_OFFLINE_AFTER_SECONDS: ${BQM_OFFLINE_AFTER_SECONDS:-120}
      BQM_BACKFILL_PAGE_SIZE: ${BQM_BACKFILL_PAGE_SIZE:-500}
      BQM_DATA_DIR: /data
      # Admin console. Leave unset to keep /admin disabled (it fails closed).
      BQM_ADMIN_PASSWORD: ${BQM_ADMIN_PASSWORD:-}
      BQM_ADMIN_SECRET: ${BQM_ADMIN_SECRET:-}
      BQM_LOG_INTERVAL_SECONDS: ${BQM_LOG_INTERVAL_SECONDS:-60}
      BQM_RETENTION_DAYS: ${BQM_RETENTION_DAYS:-1095}
      BQM_RACK_NAME: ${BQM_RACK_NAME:-Eco-worthy Rack}
      BQM_RACK_BUILDER: ${BQM_RACK_BUILDER:-Tran Thanh Tuan}
      BQM_RACK_LOCATION: ${BQM_RACK_LOCATION:-Battery room}
      BQM_COLLECTOR_NAME: ${BQM_COLLECTOR_NAME:-Raspberry Pi collector}
      BQM_BATTERY_IDS: ${BQM_BATTERY_IDS:-rack-1,rack-2,rack-3,rack-4}
      BQM_BATTERY_ADDRESSES: ${BQM_BATTERY_ADDRESSES:-1,2,3,4}
      BQM_BATTERY_NAMES: ${BQM_BATTERY_NAMES:-Rack Battery 1,Rack Battery 2,Rack Battery 3,Rack Battery 4}
      BQM_BATTERY_IPS: ${BQM_BATTERY_IPS:-,,,}
      BQM_BATTERY_MODELS: ${BQM_BATTERY_MODELS:-Eco-worthy 48V 100Ah server rack battery,Eco-worthy 48V 100Ah server rack battery,Eco-worthy 48V 100Ah server rack battery,Eco-worthy 51.2V 314Ah server rack battery}
      BQM_UTILITY_PROVIDER: ${BQM_UTILITY_PROVIDER:-Puget Sound Energy}
      BQM_UTILITY_SCHEDULE: ${BQM_UTILITY_SCHEDULE:-Residential Time-of-Use with Super Off-Peak (Schedule 327)}
      BQM_UTILITY_REGION: ${BQM_UTILITY_REGION:-King County, WA}
      BQM_UTILITY_RATE_EFFECTIVE_DATE: ${BQM_UTILITY_RATE_EFFECTIVE_DATE:-2026-10-01}
      BQM_UTILITY_TIMEZONE: ${BQM_UTILITY_TIMEZONE:-America/Los_Angeles}
      BQM_UTILITY_ON_PEAK_WINTER_USD_PER_KWH: ${BQM_UTILITY_ON_PEAK_WINTER_USD_PER_KWH:-0.511994}
      BQM_UTILITY_ON_PEAK_SUMMER_USD_PER_KWH: ${BQM_UTILITY_ON_PEAK_SUMMER_USD_PER_KWH:-0.278604}
      BQM_UTILITY_OFF_PEAK_WINTER_USD_PER_KWH: ${BQM_UTILITY_OFF_PEAK_WINTER_USD_PER_KWH:-0.135507}
      BQM_UTILITY_OFF_PEAK_SUMMER_USD_PER_KWH: ${BQM_UTILITY_OFF_PEAK_SUMMER_USD_PER_KWH:-0.128820}
      BQM_UTILITY_SUPER_OFF_PEAK_WINTER_USD_PER_KWH: ${BQM_UTILITY_SUPER_OFF_PEAK_WINTER_USD_PER_KWH:-0.083961}
      BQM_UTILITY_SUPER_OFF_PEAK_SUMMER_USD_PER_KWH: ${BQM_UTILITY_SUPER_OFF_PEAK_SUMMER_USD_PER_KWH:-0.082307}
      # Per-kWh riders and credits, netted, billed on every kilowatt-hour.
      BQM_UTILITY_RIDERS_USD_PER_KWH: ${BQM_UTILITY_RIDERS_USD_PER_KWH:-0.039102}
      # Schedule 7, the standard plan the savings figure is compared with.
      BQM_UTILITY_COMPARISON_SCHEDULE: ${BQM_UTILITY_COMPARISON_SCHEDULE:-Residential Service (Schedule 7)}
      BQM_UTILITY_TIER_1_USD_PER_KWH: ${BQM_UTILITY_TIER_1_USD_PER_KWH:-0.148363}
      BQM_UTILITY_TIER_2_USD_PER_KWH: ${BQM_UTILITY_TIER_2_USD_PER_KWH:-0.167780}
      BQM_UTILITY_TIER_1_LIMIT_KWH: ${BQM_UTILITY_TIER_1_LIMIT_KWH:-600}
      BQM_UTILITY_TIER_1_PERIOD_DAYS: ${BQM_UTILITY_TIER_1_PERIOD_DAYS:-30}
      BQM_UTILITY_BASIC_CHARGE_USD: ${BQM_UTILITY_BASIC_CHARGE_USD:-7.49}
      BQM_UTILITY_MUNICIPAL_TAX_PERCENT: ${BQM_UTILITY_MUNICIPAL_TAX_PERCENT:-6.695}
      BQM_WEATHER_ENABLED: ${BQM_WEATHER_ENABLED:-true}
      BQM_WEATHER_LATITUDE: ${BQM_WEATHER_LATITUDE:-47.3809}
      BQM_WEATHER_LONGITUDE: ${BQM_WEATHER_LONGITUDE:--122.2348}
      BQM_WEATHER_LOCATION: ${BQM_WEATHER_LOCATION:-Kent, WA}
      BQM_WEATHER_TIMEOUT_SECONDS: ${BQM_WEATHER_TIMEOUT_SECONDS:-4}
      BQM_WEATHER_REFRESH_SECONDS: ${BQM_WEATHER_REFRESH_SECONDS:-600}
    volumes:
      - ./data/monitor:/data
    ports:
      - "8080:8080"
