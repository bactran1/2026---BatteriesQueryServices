# XcodeGen spec — generates BatteryMonitor.xcodeproj deterministically from this
# file so the Xcode project never has to be hand-edited or committed.
#   $ brew install xcodegen && xcodegen generate
name: BatteryMonitor
options:
  bundleIdPrefix: com.trant
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.4" # import maps (used by three.js) need WKWebView 16.4+
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Signing is left to the operator (or CI secrets). Simulator + CI builds pass
    # with CODE_SIGNING_ALLOWED=NO; device/App Store builds set DEVELOPMENT_TEAM.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  BatteryMonitor:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trant.batterymonitor
        PRODUCT_NAME: BatteryMonitor
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
