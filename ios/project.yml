name: BatteryMonitor
options:
  bundleIdPrefix: com.trant
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  minimumXcodeGenVersion: "2.38.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
schemes:
  BatteryMonitor:
    build:
      targets:
        BatteryMonitor: all
        BatteryWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BatteryMonitorTests
    archive:
      config: Release
targets:
  BatteryMonitor:
    type: application
    platform: iOS
    sources:
      - path: BatteryMonitor
        excludes:
          - Resources
      - path: Shared
    resources:
      - path: BatteryMonitor/Resources/Assets.xcassets
      - path: BatteryMonitor/Resources/en.lproj
      - path: BatteryMonitor/Resources/vi.lproj
    dependencies:
      - target: BatteryWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trant.batterymonitor
        PRODUCT_NAME: Battery Monitor
        INFOPLIST_FILE: BatteryMonitor/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        CODE_SIGN_ENTITLEMENTS: BatteryMonitor/App.entitlements
  BatteryWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget/Sources
      - path: Shared
    resources:
      - path: BatteryMonitor/Resources/en.lproj
      - path: BatteryMonitor/Resources/vi.lproj
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trant.batterymonitor.widget
        PRODUCT_NAME: BatteryWidget
        INFOPLIST_FILE: Widget/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
  BatteryMonitorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BatteryMonitorTests
    dependencies:
      - target: BatteryMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trant.batterymonitor.tests
        GENERATE_INFOPLIST_FILE: YES
